<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이동 중...</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",sans-serif;background:#F2F4F6;color:#191F28;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
  .msg{font-size:15px;color:#8B95A1;line-height:1.6}
</style>
</head>
<body>
<div class="msg" id="msg">이동 중입니다...</div>
<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbz20SjjyYfinAwwuNYAzPTHGGkFBWK4vJQ1BL0ZxJrwYjvcDdswE9wTWk73PgcnEFN-HA/exec';
  var code = new URLSearchParams(location.search).get('c');
  if (!code) {
    document.getElementById('msg').textContent = '유효하지 않은 링크예요.';
  } else {
    fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'resolveShortCode', code: code }) })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok && d.fullLink) {
          location.replace(d.fullLink);
        } else {
          document.getElementById('msg').textContent = '유효하지 않거나 만료된 링크예요.';
        }
      })
      .catch(function() {
        document.getElementById('msg').textContent = '오류가 발생했어요. 잠시 후 다시 시도해 주세요.';
      });
  }
</script>
</body>
</html>
