<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    font-family: 'Pretendard', sans-serif;
    background: linear-gradient(160deg, #E7F0FD 0%, #F3F8FE 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .bi { display: flex; align-items: center; gap: 16px; margin-bottom: 36px; }
  .bi img { height: 58px; width: auto; filter: drop-shadow(0 8px 18px rgba(27,71,160,.22)); }
  .bi span { font-size: 42px; font-weight: 800; color: #13203A; letter-spacing: -1.4px; }
  .badge {
    font-size: 29px; font-weight: 700; color: #fff; letter-spacing: -.5px;
    background: #16294F; padding: 15px 32px; border-radius: 999px; margin-bottom: 46px;
  }
  .title {
    font-size: 86px; font-weight: 900; line-height: 1.16; text-align: center;
    color: #13203A; letter-spacing: -2.5px; margin-bottom: 58px;
  }
  .title .b { color: #2C6FE3; }
  .price {
    background: linear-gradient(150deg, #16294F 0%, #21407A 100%);
    border-radius: 38px; padding: 46px 96px; text-align: center; margin-bottom: 46px;
    box-shadow: 0 24px 60px rgba(22,41,79,.28);
  }
  .price .orig { font-size: 42px; color: #8FA0C4; text-decoration: line-through; text-decoration-thickness: 3px; font-weight: 600; }
  .price .now { font-size: 112px; font-weight: 900; color: #fff; letter-spacing: -4px; line-height: 1; margin-top: 10px; }
  .price .now .won { font-size: 54px; margin-left: 4px; }
  .foot { display: flex; align-items: center; gap: 20px; }
  .foot .off {
    font-size: 34px; font-weight: 900; color: #fff; letter-spacing: -.5px;
    background: linear-gradient(135deg, #D9A431, #C8902B); padding: 13px 30px; border-radius: 999px;
    box-shadow: 0 10px 22px rgba(200,144,43,.34);
  }
  .foot .txt { font-size: 34px; font-weight: 700; color: #43506B; letter-spacing: -.8px; }
</style>
</head>
<body>
  <div class="bi"><img src="U_ALF.png" alt="고방"><span>고방 블로그</span></div>
  <div class="badge">구매 원장님 전용 · 5일 한정</div>
  <div class="title">고방 공식 블로그<br><span class="b">포스팅</span> 발행</div>
  <div class="price">
    <div class="orig">정가 150,000원</div>
    <div class="now">100,000<span class="won">원</span></div>
  </div>
  <div class="foot">
    <span class="off">5만원 할인</span>
    <span class="txt">VAT 별도 · 구매 원장 전용가</span>
  </div>
</body>
</html>
