<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 720px;
    font-family: 'Pretendard', sans-serif;
    background: linear-gradient(155deg, #0E3370 0%, #0B2A5C 60%, #102A55 100%);
    color: #F2F6FF; padding: 78px 76px;
    display: flex; flex-direction: column; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .dt { font-size: 62px; font-weight: 900; line-height: 1.22; letter-spacing: -1.8px; margin-bottom: 62px; }
  .dt .b { color: #84B4FF; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 38px 60px; }
  .item { display: flex; align-items: center; gap: 20px; font-size: 35px; font-weight: 600; letter-spacing: -1.2px; white-space: nowrap; }
  .ic { width: 54px; height: 54px; border-radius: 50%; background: #2C6FE3; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ic.gold { background: linear-gradient(135deg, #D9A431, #C8902B); }
  .ic svg { width: 30px; height: 30px; }
  .tag { font-size: 25px; font-weight: 800; color: #fff; background: #C8902B; padding: 5px 15px; border-radius: 999px; margin-left: 10px; }
</style>
</head>
<body>
  <div class="dt">월 17만 명이 보는 블로그에,<br><span class="b">내 지점</span>을 올리세요</div>
  <div class="grid">
    <div class="item"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>고방 공식 블로그 발행</div>
    <div class="item"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>네이버 최적화 지수 2+</div>
    <div class="item"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>A·B 템플릿 직접 선택</div>
    <div class="item"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>강조 포인트 자유 반영</div>
    <div class="item"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>키워드 1~3개 직접 제출</div>
    <div class="item"><span class="ic gold"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2 15 8.5 22 9.3 17 14l1.3 7L12 17.6 5.7 21 7 14 2 9.3l7-.8z" fill="#fff"/></svg></span>발행 URL 알림톡<span class="tag">7일 내</span></div>
  </div>
</body>
</html>
